# =============================================================================
# FieldMind AI — Infrastructure (SOURCE OF TRUTH)
# =============================================================================
# This file is the single source of truth for FieldMind AI's local
# development / staging infrastructure: PostgreSQL+PostGIS, Redis,
# ZooKeeper, and Kafka.
#
# It is included by the root `docker-compose.yml` via the Compose `include:`
# directive (Compose v2.20+), so `docker compose up -d` works from the
# repository root without an extra `-f` flag — there is exactly one
# definition of each service, here.
#
# Usage (from the repository root, with a `.env` created from .env.example):
#   docker compose up -d          start all infrastructure
#   docker compose ps             check container status
#   docker compose logs -f kafka  tail one service's logs
#   docker compose down           stop (data volumes are preserved)
#   docker compose down -v        stop AND delete all data (destructive)
#
# See docs/DATABASE.md, docs/KAFKA.md, and docs/ARCHITECTURE.md for full
# connection details, environment variables, and troubleshooting.
#
# Security notes (local development only — see docs for production):
#   - Kafka listens in PLAINTEXT with no authentication. Production MUST
#     use TLS + SASL.
#   - Postgres/Redis/Kafka host ports are published to 127.0.0.1 only —
#     not reachable from other machines on the network.
#   - A single Kafka broker and single Postgres instance are NOT highly
#     available. Production requires a multi-broker Kafka cluster and a
#     replicated/managed Postgres instance.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fieldmind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldmind}
      POSTGRES_USER: ${POSTGRES_USER:-fieldmind}
      # No fallback for the password — fail loudly at `docker compose up`
      # rather than silently starting with a weak/empty credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

    # Bound to loopback only: FastAPI running on the host reaches this via
    # localhost:5432, but it is not exposed to the wider network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fieldmind} -d ${POSTGRES_DB:-fieldmind}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - fieldmind-network


  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.1
    container_name: fieldmind-redis
    restart: unless-stopped

    # --appendonly: durability across restarts.
    # --maxmemory / --maxmemory-policy: bound memory use in local dev instead
    # of letting the cache grow without limit.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - fieldmind-network


  # ---------------------------------------------------------------------------
  # ZooKeeper (required by Kafka 7.6.1; this project has not adopted KRaft)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fieldmind-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Bound JVM heap so ZooKeeper can't consume unbounded host memory.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

    # No host port published — only Kafka, on the same Docker network,
    # needs to reach ZooKeeper. Reduces exposed attack surface.
    expose:
      - "2181"

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

    healthcheck:
      # `ruok` is disabled by default on this image (only `srvr` ships
      # enabled) and cp-kafka:7.6.1 does not honor
      # ZOOKEEPER_4LW_COMMANDS_WHITELIST to re-enable it, so `srvr` (which
      # prints "Mode: standalone" once serving) is used instead.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - fieldmind-network


  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fieldmind-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Bound JVM heap so Kafka can't consume unbounded host memory.
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

      # INTERNAL: other containers on fieldmind-network (Celery/Kafka
      #           workers) reach Kafka at kafka:29092.
      # EXTERNAL: the host machine (FastAPI running outside Docker) reaches
      #           Kafka at localhost:9092.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker development settings. A production cluster needs
      # >=3 brokers with these raised to match (see docs/KAFKA.md).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

      # Kept on for local development convenience. Staging/production
      # should disable this and create topics explicitly so partition
      # counts and retention are deliberate, not accidental.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - fieldmind-network


# =============================================================================
# Persistent Volumes
# =============================================================================
volumes:
  postgres_data:
    name: fieldmind-postgres-data
  redis_data:
    name: fieldmind-redis-data
  zookeeper_data:
    name: fieldmind-zookeeper-data
  zookeeper_logs:
    name: fieldmind-zookeeper-logs
  kafka_data:
    name: fieldmind-kafka-data


# =============================================================================
# Network
# =============================================================================
networks:
  fieldmind-network:
    name: fieldmind-network
    driver: bridge
